[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thermax"
version = "0.0.1"
description = "Thermal and thermo-mechanical topology optimization on top of feax."
readme = "README.md"
requires-python = ">=3.9"
# feax is GPL-3.0-or-later and thermax links against it, so thermax is too.
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Naruki-Ichihara", email = "ichihara.naruki@nihon-u.ac.jp"},
]
keywords = ["JAX", "topology-optimization", "heat-conduction", "finite-element", "GPU"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "feax",
    "numpy",
]

[project.optional-dependencies]
# MMA, needed for objectives that grow with material (see thermax.optim).
mma = [
    "nlopt",
]
# Incremental snapshots of a running optimisation (see thermax.io).
h5 = [
    "h5py",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thermax*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = ["E501", "B008", "C901"]
